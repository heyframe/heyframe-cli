name: Smoke Test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # ratchet:actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          check-latest: true

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # ratchet:shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Compile heyframe-cli
        run: go build

      - name: Move to usr/bin
        run: mv heyframe-cli /usr/local/bin/

      - name: Checkout Plugin
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v4
        with:
          repository: 'FriendsOfHeyFrame/FroshTools'
          ref: '75e2013752fd4db7535e4b72b3e3e8d57e531002'
          path: 'plugin'

      - name: Create HeyFrame
        run: heyframe-cli project create heyframe 6.5.7.3

      - name: Build asset of Plugin
        run: heyframe-cli extension zip plugin

      - name: Build asset of Plugin without Git
        run: heyframe-cli extension zip plugin --disable-git --release

      - name: Validate Plugin
        run: heyframe-cli extension validate FroshTools.zip

      - name: Get Changelog
        run: heyframe-cli extension get-changelog FroshTools.zip

      - name: Build asset against custom PROJECT_ROOT
        env:
          HEYFRAME_PROJECT_ROOT: ${{ github.workspace }}/heyframe
        run: |
          mv plugin/.heyframe-extension.yml plugin/.heyframe-extension-disable.yml
          heyframe-cli extension build plugin
          mv plugin/.heyframe-extension-disable.yml plugin/.heyframe-extension.yml

      - name: Install a Frontend Plugin
        working-directory: heyframe
        run: |
          composer require 'frosh/platform-filter-search:*' --no-interaction --no-scripts
          rm -rf vendor

      - name: Setup the project
        uses: heyframe/build-project-action@main
        with:
          path: heyframe
